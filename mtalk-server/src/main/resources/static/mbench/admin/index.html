<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MBench 사용자 관리</title>
    <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
<div id="app">
    <section id="login-panel" class="panel card">
        <h1>MBench 관리자</h1>
        <p class="hint">피험자 계정(ID/PW 및 기본 정보)을 등록·수정·삭제합니다.</p>
        <form id="login-form">
            <label>관리자 ID
                <input type="text" id="login-id" value="super-admin" autocomplete="username" required>
            </label>
            <label>비밀번호
                <input type="password" id="login-password" autocomplete="current-password" required>
            </label>
            <button type="submit" class="btn primary">로그인</button>
        </form>
        <p id="login-error" class="error" hidden></p>
    </section>

    <section id="main-panel" class="panel" hidden>
        <header class="topbar">
            <div>
                <h1>사용자 관리</h1>
                <p class="hint">Unity 앱 로그인에 사용되는 피험자 계정 목록</p>
            </div>
            <div class="topbar-actions">
                <button type="button" id="btn-refresh" class="btn">새로고침</button>
                <button type="button" id="btn-add" class="btn primary">+ 사용자 등록</button>
                <button type="button" id="btn-logout" class="btn ghost">로그아웃</button>
            </div>
        </header>

        <div class="card table-wrap">
            <table>
                <thead>
                <tr>
                    <th>SEQ</th>
                    <th>로그인 ID</th>
                    <th>이름</th>
                    <th>이메일</th>
                    <th>전화</th>
                    <th>레벨</th>
                    <th>도메인</th>
                    <th>등록일</th>
                    <th></th>
                </tr>
                </thead>
                <tbody id="user-rows">
                <tr><td colspan="9" class="empty">불러오는 중…</td></tr>
                </tbody>
            </table>
        </div>
    </section>

    <dialog id="user-dialog">
        <form id="user-form" method="dialog">
            <h2 id="dialog-title">사용자 등록</h2>
            <input type="hidden" id="field-seq">
            <div class="form-grid">
                <label>로그인 ID <span class="req">*</span>
                    <input type="text" id="field-id" required placeholder="예: s_player1">
                </label>
                <label>비밀번호 <span id="pw-label-req" class="req">*</span>
                    <input type="password" id="field-password" placeholder="수정 시 비우면 유지">
                </label>
                <label>이름
                    <input type="text" id="field-name">
                </label>
                <label>이메일
                    <input type="email" id="field-email">
                </label>
                <label>전화
                    <input type="text" id="field-phone">
                </label>
                <label>레벨 ID
                    <input type="number" id="field-level" value="1" min="1">
                </label>
                <label>도메인
                    <input type="text" id="field-domain" value="spike">
                </label>
            </div>
            <p id="form-error" class="error" hidden></p>
            <div class="dialog-actions">
                <button type="button" class="btn ghost" id="btn-cancel">취소</button>
                <button type="submit" class="btn primary" id="btn-save">저장</button>
            </div>
        </form>
    </dialog>
</div>
<script src="/admin/admin.js"></script>
</body>
</html>
