<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUDIT 관리자 로그인</title>
    <link rel="stylesheet" href="/hudit/css/portal.css?v=3">
</head>
<body>
<div class="hudit-login-wrap hudit-login-wrap--center">
    <div class="hudit-login-card hudit-card">
        <div class="hudit-login-header">
            <div class="hudit-brand-mark">H</div>
            <h1>HUDIT</h1>
            <p class="hudit-tagline">환자를 위한 건강 케어 플랫폼</p>
        </div>

        <h2 class="hudit-login-title">관리자 로그인</h2>
        <p class="hudit-login-sub">통합 관리 포털에 접속합니다</p>

        <div id="login-alert"></div>
        <form id="login-form">
            <div class="hudit-form-group">
                <label class="hudit-label" for="login-id">아이디</label>
                <input class="hudit-input" id="login-id" name="loginId" type="text" placeholder="아이디를 입력하세요" autocomplete="username" required>
            </div>
            <div class="hudit-form-group">
                <label class="hudit-label" for="login-password">비밀번호</label>
                <input class="hudit-input" id="login-password" name="password" type="password" placeholder="비밀번호를 입력하세요" autocomplete="current-password" required>
            </div>
            <button class="hudit-btn hudit-btn-primary hudit-btn-block" type="submit">로그인</button>
        </form>
    </div>
</div>
<script src="/hudit/js/portal.js"></script>
<script>
document.addEventListener("DOMContentLoaded", async () => {
    const alertBox = document.getElementById("login-alert");
    const form = document.getElementById("login-form");

    try {
        const session = await huditFetch("/auth/session");
        if (session.authenticated) {
            window.location.href = "/hudit/dashboard";
            return;
        }
    } catch (_) {}

    form.addEventListener("submit", async (event) => {
        event.preventDefault();
        clearAlert(alertBox);
        const loginId = document.getElementById("login-id").value.trim();
        const password = document.getElementById("login-password").value;
        const submitBtn = form.querySelector("button[type=submit]");
        submitBtn.disabled = true;

        try {
            await huditFetch("/auth/login", {
                method: "POST",
                body: JSON.stringify({ loginId, password })
            });
            window.location.href = "/hudit/dashboard";
        } catch (error) {
            showAlert(alertBox, error.message || "로그인에 실패했습니다.");
        } finally {
            submitBtn.disabled = false;
        }
    });
});
</script>
</body>
</html>
